version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: connect_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-connect}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  # We can add backend service here if we want to run it via docker-compose, but for now we only need Postgres.
  # The backend will be run locally for development.

volumes:
  postgres_data: